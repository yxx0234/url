<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>订阅转换</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;display:flex;justify-content:center;padding:20px}
.container{width:100%;max-width:600px}
h2{text-align:center;margin:20px 0 10px}
.sub{text-align:center;color:#888;font-size:13px;margin-bottom:20px}
textarea{width:100%;height:200px;background:#16213e;border:1px solid #0f3460;border-radius:8px;color:#eee;padding:12px;font-size:13px;resize:vertical;outline:none}
textarea:focus{border-color:#e94560}
.btns{display:flex;gap:10px;margin:12px 0}
button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
.btn-gen{background:#e94560;color:#fff}
.btn-copy{background:#0f3460;color:#eee}
.result-box{margin-top:12px;background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:12px;font-size:11px;color:#0f0;min-height:44px;max-height:300px;overflow:auto;display:none;white-space:pre-wrap;word-break:break-all}
.result-box.show{display:block}
.msg{margin-top:8px;font-size:12px;color:#888;text-align:center;display:none}
.msg.show{display:block}
</style>
</head>
<body>
<div class="container">
<h2>节点 → 订阅 YAML</h2>
<p class="sub">粘贴 vmess:// / vless:// / trojan:// / ss:// 链接<br>复制生成的 YAML 去 GitHub 仓库创建 config.yaml<br>订阅地址：<b>https://fastly.jsdelivr.net/gh/yxx0234/url@main/config.yaml</b></p>
<textarea id="input" placeholder="每行粘贴一条节点链接..."></textarea>
<div class="btns">
  <button class="btn-gen" onclick="generate()">生成 YAML</button>
  <button class="btn-copy" onclick="copyYaml()">复制 YAML</button>
</div>
<div id="result" class="result-box"></div>
<div id="msg" class="msg"></div>
</div>

<script>
function safeName(str){
  return str.replace(/[^a-zA-Z0-9\u4e00-\u9fff\-_ ]/g,'').substring(0,30)||'节点';
}

function decodeB64(s){
  try{ return atob(s); }catch(e){ return s; }
}

function parseSS(uri){
  try{
    let main = uri.replace('ss://','');
    let tag = '';
    if(main.indexOf('#')>0){
      let idx = main.lastIndexOf('#');
      tag = decodeURIComponent(main.substring(idx+1));
      main = main.substring(0,idx);
    }
    let decoded = decodeB64(main);
    // "method:password@server:port" or just "method:password"
    if(decoded.indexOf('@')<0) return null;
    let [up,sp] = decoded.split('@');
    let [method,password] = up.split(':');
    let [server,port] = sp.split(':');
    return {name:safeName(tag)||'SS',type:'ss',server,port:parseInt(port)||8388,cipher:method||'aes-256-gcm',password};
  }catch(e){ return null; }
}

function parseVMess(uri){
  try{
    let j = JSON.parse(decodeB64(uri.replace('vmess://','')));
    return {
      name: safeName(j.ps)||'VM',
      type: 'vmess', server: j.add, port: parseInt(j.port)||443,
      uuid: j.id, alterId: j.aid||0, cipher: j.scy||'auto'
    };
  }catch(e){ return null; }
}

function parseTrojan(uri){
  try{
    let main = uri.replace('trojan://',''), tag='';
    if(main.indexOf('#')>0){
      let idx = main.lastIndexOf('#');
      tag = decodeURIComponent(main.substring(idx+1));
      main = main.substring(0,idx);
    }
    let [up,sp] = main.split('@');
    let [server,port] = sp.split(':');
    return {name:safeName(tag)||'TJ',type:'trojan',server,port:parseInt(port)||443,password:up};
  }catch(e){ return null; }
}

function generate(){
  let raw = document.getElementById('input').value.trim();
  let box = document.getElementById('result'), msg = document.getElementById('msg');
  box.classList.remove('show'); msg.classList.remove('show');
  if(!raw){ msg.textContent='请先粘贴节点链接'; msg.classList.add('show'); return; }

  let lines = raw.split('\n').filter(l=>l.trim());
  let proxies = [];
  for(let i=0;i<lines.length;i++){
    let l = lines[i].trim(), p = null;
    if(l.startsWith('vmess://')) p = parseVMess(l);
    else if(l.startsWith('ss://')) p = parseSS(l);
    else if(l.startsWith('trojan://')) p = parseTrojan(l);
    if(p) proxies.push(p);
  }

  if(proxies.length===0){ msg.textContent='没有识别到有效节点链接'; msg.classList.add('show'); return; }

  let names = proxies.map((_,i)=>'节点'+(i+1));
  let yamlLines = [
    '# Clash Meta - '+new Date().toLocaleDateString('zh-CN'),
    'port: 7890','socks-port: 7891','allow-lan: false','mode: rule','log-level: info',
    '','proxies:'
  ];

  for(let i=0;i<proxies.length;i++){
    let p = proxies[i], n = names[i];
    yamlLines.push('  - name: "'+n+'"');
    yamlLines.push('    type: '+p.type);
    yamlLines.push('    server: "'+p.server+'"');
    yamlLines.push('    port: '+p.port);
    if(p.cipher) yamlLines.push('    cipher: '+p.cipher);
    if(p.password) yamlLines.push('    password: "'+p.password+'"');
    if(p.uuid) yamlLines.push('    uuid: "'+p.uuid+'"');
    if(p.alterId!==undefined) yamlLines.push('    alterId: '+p.alterId);
  }

  yamlLines.push('','proxy-groups:','  - name: "\uD83D\uDE80 代理"','    type: url-test','    proxies:');
  for(let n of names) yamlLines.push('      - "'+n+'"');
  yamlLines.push('    url: "http://www.gstatic.com/generate_204"','    interval: 300');
  yamlLines.push('','rules:','  - GEOIP,CN,DIRECT','  - MATCH,\uD83D\uDE80 代理','');

  let yaml = yamlLines.join('\n');
  box.textContent = yaml;
  box.classList.add('show');
  msg.textContent = '已生成 '+proxies.length+' 个节点。复制后去 GitHub 仓库 → 新建 config.yaml → 粘贴 → Commit';
  msg.classList.add('show');
}

function copyYaml(){
  let box = document.getElementById('result'), msg = document.getElementById('msg');
  if(!box.classList.contains('show')){ msg.textContent='请先生成'; msg.classList.add('show'); return; }
  navigator.clipboard.writeText(box.textContent).then(()=>{
    msg.textContent='已复制！去 GitHub → 仓库 → Add file → config.yaml → 粘贴';
  }).catch(()=>{ msg.textContent='复制失败，请手动复制'; });
  msg.classList.add('show');
}
</script>
</body>
</html>
